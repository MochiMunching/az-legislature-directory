name: Hourly Capitol feed

# Refreshes only the "Latest from the Capitol" feed (data/updates_feed.json):
# Governor's Office, Arizona Mirror, Chamber Business News, JLBC reports and
# tracked-bill actions. Runs at 47 minutes past every hour, which keeps it clear
# of the daily refresh at 13:17 UTC. GitHub can start scheduled runs a few
# minutes late when its servers are busy.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Same group as the daily "Refresh public data" job, so the two never push at once.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Build the feed
        run: python scraper/capitol_updates.py

      # Commits only when something new came in, so most hours add no commit.
      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- data/updates_feed.json; then
            echo "No new items this hour."
            exit 0
          fi
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add data/updates_feed.json
          git commit -m "Update Capitol feed $(date -u '+%F %H:%M') UTC"
          git pull --rebase
          git push
